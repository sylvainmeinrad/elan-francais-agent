name: Publier sur Instagram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = publier ; check = tester sans publier"
        default: check
        type: choice
        options: [check, publish]

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            publish.py
            schedule.json
            published.json
          sparse-checkout-cone-mode: false
      - name: Publier les éléments à l'heure
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          MODE: ${{ inputs.mode || 'publish' }}
        run: python3 publish.py
      - name: Enregistrer ce qui a été publié
        if: always()
        run: |
          git config user.name "elan-agent"
          git config user.email "elan-agent@users.noreply.github.com"
          git add published.json
          git diff --cached --quiet || (git commit -m "Publications du $(date -u +%FT%H:%MZ)" && git push)
